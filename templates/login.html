<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sistem Girişi | MEB Yerleştirme</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card shadow-lg" style="width: 25rem;">
        <div class="card-header bg-dark text-white text-center py-3">
            <h4 class="mb-0">Personel Giriş Ekranı</h4>
        </div>
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <img src="https://upload.wikimedia.org/wikipedia/tr/b/b8/T.C._Milli_E%C4%9Fitim_Bakanl%C4%B1%C4%9F%C4%B1_Logo.svg" alt="MEB Logo" style="width: 80px;">
            </div>
            
            {% if hata %}
            <div class="alert alert-danger text-center">{{ hata }}</div>
            {% endif %}
            
            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Kullanıcı Adı</label>
                    <input type="text" class="form-control" name="kullanici_adi" required autocomplete="off">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Şifre</label>
                    <input type="password" class="form-control" name="sifre" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold">Sisteme Giriş Yap</button>
            </form>
        </div>
        <div class="card-footer text-center text-muted">
            <small>Eyüpsultan İlçe MEM - Yetkisiz erişim yasaktır.</small>
        </div>
    </div>
</body>
</html>
