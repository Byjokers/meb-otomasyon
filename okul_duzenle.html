<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Okul Düzenle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-primary">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0 text-center">Okul Bilgilerini Güncelle</h4>
                    </div>
                    <div class="card-body">
                        <!-- Kaydet butonuna basılınca okulun ID'sine göre güncelleyecek -->
                        <form action="/okul_duzenle/{{ okul.okul_id }}" method="POST">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Okul Adı</label>
                                <input type="text" class="form-control" name="okul_adi" value="{{ okul.okul_adi }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Alım Türü (Yerleştirme Şekli)</label>
                                <select class="form-select border-primary" name="okul_turu" required>
                                    <option value="Yerel_Yerlestirme" {% if okul.okul_turu == 'Yerel_Yerlestirme' %}selected{% endif %}>Yerel Yerleştirme (OBP İle)</option>
                                    <option value="Merkezi_Sinav" {% if okul.okul_turu == 'Merkezi_Sinav' %}selected{% endif %}>Merkezi Sınav (LGS İle)</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold text-success">Okul Kontenjanı (Standart)</label>
                                <input type="number" class="form-control border-success" name="kontenjan" value="{{ okul.kontenjan }}" required min="1">
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold text-danger">Özel Eğitim Kontenjanı</label>
                                <input type="number" class="form-control border-danger" name="ozel_egitim_kontenjan" value="{{ okul.ozel_egitim_kontenjan if okul.ozel_egitim_kontenjan is not none else 10 }}" required min="0">
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label text-warning fw-bold">Taban Puan Barajı (Sınavlı Okullar İçin)</label>
                                <input type="number" step="0.0001" class="form-control border-warning" name="taban_puan" value="{{ okul.taban_puan }}" required>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary text-white fw-bold">Değişiklikleri Kaydet</button>
                                <a href="/okullar" class="btn btn-secondary fw-bold">İptal Et ve Geri Dön</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
