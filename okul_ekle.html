<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yeni Okul Tanımlama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-info">
                    <div class="card-header bg-info text-white">
                        <h4 class="mb-0 text-center">İlçe Okul Kontenjanı Tanımlama Formu</h4>
                    </div>
                    <div class="card-body">
                        <form action="/okul_ekle" method="POST">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Okul Adı</label>
                                <input type="text" class="form-control" name="okul_adi" required placeholder="Örn: Eyüpsultan Anadolu Lisesi">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Alım Türü (Yerleştirme Şekli)</label>
                                <select class="form-select border-primary" name="okul_turu" required>
                                    <option value="Yerel_Yerlestirme">Yerel Yerleştirme (OBP İle)</option>
                                    <option value="Merkezi_Sinav">Merkezi Sınav (LGS İle)</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold text-success">Okul Kontenjanı (Standart)</label>
                                <input type="number" class="form-control border-success" name="kontenjan" required min="1" placeholder="Açık Kontenjan Sayısı">
                            </div>
                            
                            <!-- Yeni Eklenen Özel Eğitim Alanı -->
                            <div class="mb-3">
                                <label class="form-label fw-bold text-danger">Özel Eğitim Kontenjanı</label>
                                <input type="number" class="form-control border-danger" name="ozel_egitim_kontenjan" value="10" required min="0" placeholder="Şube başı kontenjana göre belirleyin (Örn: 10)">
                                <small class="text-muted">Varsayılan 10 olarak gelir, yeni şube açılışlarına göre değiştirebilirsiniz.</small>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label text-warning fw-bold">Taban Puan Barajı (Sınavlı Okullar İçin)</label>
                                <input type="number" step="0.0001" class="form-control border-warning" name="taban_puan" value="0" required>
                                <small class="text-muted">Yerel yerleştirme (OBP) okulları için 0 bırakabilirsiniz.</small>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-info text-white fw-bold">Okulu Sisteme Kaydet</button>
                                <a href="/" class="btn btn-secondary fw-bold">Ana Panele Dön</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
